name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: queuepilot_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3.12-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5672:5672

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd redis-cli\ ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build
      env:
        DATABASE_URL: jdbc:postgresql://localhost:5432/queuepilot_test
        DATABASE_USER: test_user
        DATABASE_PASSWORD: test_password
        RABBITMQ_HOST: localhost
        REDIS_HOST: localhost

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: queuepilot-app
        path: build/libs/*.jar
        retention-days: 1
