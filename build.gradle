plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '9.22.3'
}

group = 'com.sanyabhasin'
version = '1.0.0'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Database
    implementation 'org.postgresql:postgresql:42.6.0'
    implementation 'org.flywaydb:flyway-core:9.22.3'
    
    // Redis
    implementation 'redis.clients:jedis:5.0.1'
    
    // JSON
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    
    // OpenTelemetry
    implementation 'io.opentelemetry:opentelemetry-api:1.30.0'
    implementation 'io.opentelemetry:opentelemetry-sdk:1.30.0'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-api:1.30.0'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp:1.30.0'
    
    // Micrometer (Prometheus)
    implementation 'io.micrometer:micrometer-registry-prometheus:1.11.3'
    
    // Logging
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    
    // Cron parsing
    implementation 'com.cronutils:cron-utils:9.2.0'
    
    // HMAC
    implementation 'commons-codec:commons-codec:1.16.0'
    
    // OpenAPI/Springdoc
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
    
    // Development
    runtimeOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.amqp:spring-rabbit-test'
    testImplementation 'org.testcontainers:testcontainers:1.19.2'
    testImplementation 'org.testcontainers:postgresql:1.19.2'
    testImplementation 'org.testcontainers:rabbitmq:1.19.2'
    testImplementation 'com.h2database:h2:2.2.220'
    testImplementation 'io.rest-assured:rest-assured:5.3.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Flyway configuration
flyway {
    url = System.getenv('FLYWAY_URL') ?: 'jdbc:postgresql://localhost:5432/queuepilot'
    user = System.getenv('FLYWAY_USER') ?: 'queuepilot_dev'
    password = System.getenv('FLYWAY_PASSWORD') ?: 'dev_password'
    locations = ['filesystem:src/main/resources/db/migration']
    baselineOnMigrate = true
}
